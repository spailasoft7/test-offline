
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat</title>

    <!-- Puter.js -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #1f51ff;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
        }

        .app {
            height: 100vh;
            max-width: 900px;
            margin: auto;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            height: 65px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 20px;
        }

        header p {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        #newChat {
            border: 1px solid var(--border);
            background: white;
            padding: 8px 12px;
            border-radius: 9px;
            cursor: pointer;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 14px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .welcome {
            margin: auto;
            text-align: center;
        }

        .welcome-icon {
            width: 55px;
            height: 55px;
            margin: auto;
            margin-bottom: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary);
            color: white;

            border-radius: 16px;
            font-weight: bold;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: var(--muted);
        }

        /* MESSAGES */

        .message {
            display: flex;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 82%;
            padding: 12px 14px;

            border-radius: 15px;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: #f0f2f5;
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        /* INPUT */

        .input-container {
            padding: 10px 12px;

            border-top: 1px solid var(--border);

            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        #input {
            flex: 1;

            resize: none;

            min-height: 44px;
            max-height: 140px;

            padding: 12px;

            border: 1px solid var(--border);
            border-radius: 13px;

            font-family: inherit;
            font-size: 15px;

            outline: none;
        }

        #input:focus {
            border-color: var(--primary);
        }

        #send {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 12px;

            background: var(--primary);
            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.5;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 6px;

            border-top: 1px solid var(--border);

            font-size: 11px;
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .bubble {
                max-width: 90%;
            }

            header h1 {
                font-size: 18px;
            }

            #newChat {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div>
            <h1>AI Chat</h1>
            <p>Powered by Puter</p>
        </div>

        <button id="newChat">
            New chat
        </button>

    </header>


    <!-- CHAT -->

    <main id="chat">

        <div class="welcome">

            <div class="welcome-icon">
                AI
            </div>

            <h2>How can I help?</h2>

            <p>
                Ask me anything.
            </p>

        </div>

    </main>


    <!-- INPUT -->

    <form id="form" class="input-container">

        <textarea
            id="input"
            rows="1"
            placeholder="Message AI..."
            autocomplete="off"
        ></textarea>

        <button id="send" type="submit">
            ↑
        </button>

    </form>


    <!-- FOOTER -->

    <footer>
        <a
            href="https://developer.puter.com"
            target="_blank"
            rel="noopener noreferrer"
        >
            Powered by Puter
        </a>
    </footer>

</div>


<script>

    // -----------------------------
    // ELEMENTS
    // -----------------------------

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const newChat = document.getElementById("newChat");


    // -----------------------------
    // CONVERSATION
    // -----------------------------

    let messages = [];


    // -----------------------------
    // ADD MESSAGE
    // -----------------------------

    function addMessage(role, text) {

        const welcome = document.querySelector(".welcome");

        if (welcome) {
            welcome.remove();
        }


        const message = document.createElement("div");

        message.className =
            role === "user"
                ? "message user"
                : "message ai";


        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;


        message.appendChild(bubble);

        chat.appendChild(message);


        chat.scrollTop = chat.scrollHeight;


        return bubble;
    }


    // -----------------------------
    // SEND MESSAGE
    // -----------------------------

    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const text = input.value.trim();


        if (!text) {
            return;
        }


        // Lock interface
        send.disabled = true;
        input.disabled = true;


        // Show user message
        addMessage("user", text);


        // Save conversation
        messages.push({
            role: "user",
            content: text
        });


        // Clear input
        input.value = "";

        input.style.height = "auto";


        // Create AI message
        const aiBubble = addMessage(
            "ai",
            "Thinking..."
        );


        try {

            // Ask Puter AI
            const response = await puter.ai.chat(
                messages,
                {
                    stream: true
                }
            );


            let answer = "";


            // Read streaming response
            for await (const part of response) {

                if (part.type === "text") {

                    answer += part.text;

                    aiBubble.textContent = answer;

                    chat.scrollTop =
                        chat.scrollHeight;
                }
            }


            // Save AI response
            messages.push({
                role: "assistant",
                content: answer
            });


        } catch (error) {

            console.error(error);

            aiBubble.textContent =
                "Sorry, something went wrong. Please try again.";

        }


        // Unlock interface
        send.disabled = false;
        input.disabled = false;

        input.focus();

    });


    // -----------------------------
    // ENTER TO SEND
    // SHIFT + ENTER = NEW LINE
    // -----------------------------

    input.addEventListener("keydown", function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            form.requestSubmit();

        }

    });


    // -----------------------------
    // AUTO-GROW TEXTAREA
    // -----------------------------

    input.addEventListener("input", function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight, 140) + "px";

    });


    // -----------------------------
    // NEW CHAT
    // -----------------------------

    newChat.addEventListener("click", function() {

        messages = [];


        chat.innerHTML = `

            <div class="welcome">

                <div class="welcome-icon">
                    AI
                </div>

                <h2>How can I help?</h2>

                <p>
                    Ask me anything.
                </p>

            </div>

        `;


        input.value = "";

        input.focus();

    });

</script>

</body>
</html>
